# Subtask 2 (debug_train_8_26/stage0.md) inference: see
# src/entries/inference_era5_direct.py for why this can't reuse
# src/entries/inference.py's main() (no numerical-solver reference makes sense
# for an ERA5-direct model - ground truth is the real ERA5 trajectory itself).
#
# Usage: python src/entries/inference_era5_direct.py debug_train_8_26/config_inference_era5_direct.yml
inference_era5_direct:
  resol: [128, 256]
  n_future: 6
  num_layers: 4
  embed_dim: 128
  pos_embed: "none"
  trainData: "era5_direct_2023_06_500"
  grid: "equiangular"
  normalization_layer: "layer_norm"
  loss_type: "grid"
  index: 0
  dataset_name: "era5_direct_2023_06_500"
  pressure: "500"
  # the last (chronologically) converted chunk - an informal held-out choice,
  # since all 10 chunks were available to SWEDataset's random train/val file
  # split during training (see stage0.md Findings).
  ref_chunk_stem: "2023_06_28_00_to_2023_06_30_23"
  single_step: True
